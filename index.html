<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GrowStrong Achievers | Batch Scheduler</title><style>:root{font-family:Inter,system-ui,Arial;color:#193344;background:#f5f8fa}*{box-sizing:border-box}body{margin:0}header{background:white;color:#193344;border-bottom:1px solid #dce6e3;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{display:flex;align-items:center;gap:22px;min-width:0}.brand-logo{display:block;width:250px;max-width:45vw;height:auto}h1{font-size:20px;margin:0}main{padding:22px;max-width:1450px;margin:auto}.toolbar{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:20px}label{display:grid;gap:5px;font-size:13px;font-weight:600}input,select,button{font:inherit;padding:10px;border:1px solid #cdd9df;border-radius:8px}button{cursor:pointer;background:#117a6b;color:white;border:0}button.secondary{background:#e8eff2;color:#193344}.card{background:white;padding:20px;border-radius:12px;box-shadow:0 3px 15px #102e4010;margin-bottom:16px}.scroll{overflow:auto}table{border-collapse:separate;border-spacing:4px;width:100%;min-width:1000px;table-layout:fixed}th:first-child{width:140px}th{font-size:13px;background:#e8eff2;padding:12px}td{vertical-align:top}td.time{white-space:nowrap;font-weight:700;font-size:12px;padding:15px 8px}.slot{width:100%;min-height:74px;background:#eef8f5;color:#174b42;border:1px solid #d5e8e3;text-align:left;padding:10px}.slot{height:132px;overflow:hidden;min-width:0}.slot-names{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2;overflow:hidden;overflow-wrap:anywhere;white-space:normal;line-height:1.4;max-height:2.8em}.batch-label{display:block;font-size:12px;font-weight:700;margin-bottom:6px;overflow-wrap:anywhere}.slot:hover{background:#d6f0e8}.slot strong{display:block;font-size:20px}.muted{color:#607681;font-size:12px}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#102e4080;display:grid;place-items:center;padding:16px}.panel{background:white;padding:24px;border-radius:14px;width:min(520px,100%);max-height:90vh;overflow:auto}.panel h2{margin-top:0}.form{display:grid;gap:12px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.person{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #eee;padding:10px 0}.error{color:#b91c1c}.notice{background:#fff6d8;padding:12px;border-radius:8px;font-size:13px;margin-bottom:16px}@media(max-width:600px){header{padding:14px}.brand{flex-direction:column;align-items:flex-start;gap:8px}.brand-logo{width:190px;max-width:58vw}main{padding:12px}h1{font-size:16px}}</style></head><body><header><div class="brand"><img class="brand-logo" src="growstrong-logo.png" width="1315" height="525" alt="GrowStrong Achievers Kids’ Gym"><h1>Student Management</h1></div><button id="logout" class="secondary hidden">Sign out</button></header><main><section id="setup" class="card hidden"><h2>Setup required</h2><p>Enter your Supabase project URL and publishable (anon) key in <code>config.js</code>. Run the included SQL first.</p></section><section id="login" class="card hidden" style="max-width:430px;margin:50px auto"><h2>Staff sign in</h2><p class="muted">Use the shared staff account provided by your administrator.</p><form id="loginForm" class="form"><label>Email<input id="email" type="email" required autocomplete="username"></label><label>Password<input id="password" type="password" required autocomplete="current-password"></label><button>Sign in</button><div id="loginError" class="error"></div></form></section><section id="app" class="hidden"><div class="toolbar"><label>Center<select id="center"><option>Lucknow</option><option>Noida</option></select></label><button id="add">+ Add student</button><span class="muted">Recurring weekly timetable · 10 AM–8 PM</span></div><div class="card"><h2>Weekly batches</h2><div id="message" class="error"></div><div class="scroll"><table id="timetable"></table></div></div></section></main><div id="dialog" class="modal hidden"><div class="panel"><h2 id="dialogTitle">Batch details</h2><form id="batchLabelForm" class="form" style="margin-bottom:18px"><label>Batch age range<select id="batchAgeRange"><option value="">Not set</option><option value="3–6">Age 3–6</option><option value="6–9">Age 6–9</option><option value="9–12">Age 9–12</option></select></label><button id="saveBatchLabel" type="submit">Save age range</button><span id="batchLabelStatus" class="muted" role="status"></span></form><div id="people"></div><form id="studentForm" class="form hidden"><label>Student<select id="existingStudent"><option value="">Register a new student</option></select></label><div id="identity" class="form"><label>Student name<input id="studentName" required maxlength="120"></label><label>Age<input id="studentAge" type="number" min="1" max="18" required></label></div><label>Day<select id="studentDay"></select></label><label>Batch time<select id="studentHour"></select></label><div id="extraBatches"></div><button id="extra" type="button" class="secondary">+ Additional batch (optional)</button><button id="saveStudent" type="submit">Save student</button></form><div id="dialogError" class="error"></div><div class="actions"><button id="toggleForm" class="secondary">+ Add to batch</button><button id="close" class="secondary">Close</button></div></div></div><script src="config.js"></script><script type="module" src="app.js"></script></body></html>
